name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Concrete version to publish, such as 0.13.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.0 --activate
      - run: pnpm --version
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm run release:check
      - run: pnpm run release:install-smoke
      - run: env -u NODE_AUTH_TOKEN pnpm run release:publish -- ${{ inputs.version }}
      - run: pnpm run release:registry -- ${{ inputs.version }}
